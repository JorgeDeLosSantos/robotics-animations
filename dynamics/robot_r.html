<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Robot de 1 Eslabón (R)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #0f172a;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
        }

        .controls-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 300px;
            border: 1px solid var(--border);
        }

        .simulation-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex: 2;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border);
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .input-group input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        canvas {
            background: #1e1e3f;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1;
        }

        .telemetry {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
            font-family: monospace;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Simulador de Robot Rotacional (R)</h1>

    <div class="container">
        <!-- Panel de Controles -->
        <div class="controls-panel">
            <div class="section-title">Parámetros Físicos</div>
            <div class="input-group">
                <label for="mass">Masa ($m$ - kg):</label>
                <input type="number" id="mass" value="1.0" step="0.1" min="0.1">
            </div>
            <div class="input-group">
                <label for="length">Longitud ($l$ - metros):</label>
                <input type="number" id="length" value="1.5" step="0.1" min="0.1">
            </div>
            <div class="input-group">
                <label for="inertia">Inercia respecto al eje ($I$ - $kg \cdot m^2$):</label>
                <input type="number" id="inertia" value="0.5" step="0.05" min="0.01">
            </div>

            <div class="section-title" style="margin-top: 20px;">Condiciones Iniciales</div>
            <div class="input-group">
                <label for="theta">Ángulo Inicial ($\theta$ - grados):</label>
                <input type="number" id="theta" value="45" step="5">
            </div>
            <div class="input-group">
                <label for="omega">Velocidad Angular Inicial ($\omega$ - rad/s):</label>
                <input type="number" id="omega" value="0" step="0.1">
            </div>

            <div class="section-title" style="margin-top: 20px;">Fuerzas Externas</div>
            <div class="input-group">
                <label for="torque">Torque aplicado ($\tau$ - N·m):</label>
                <input type="number" id="torque" value="0" step="0.5">
            </div>
            <div class="input-group">
                <label for="damping">Amortiguamiento ($b$ - N·m·s/rad):</label>
                <input type="number" id="damping" value="0.2" step="0.05" min="0">
            </div>

            <div class="btn-group">
                <button class="btn-primary" id="btnStart">Iniciar / Pausar</button>
                <button class="btn-secondary" id="btnReset">Reiniciar</button>
            </div>
        </div>

        <!-- Panel de Simulación -->
        <div class="simulation-panel">
            <div class="section-title">Visualización en Tiempo Real</div>
            <canvas id="robotCanvas" width="500" height="500"></canvas>
            
            <div class="telemetry">
                <div>Ángulo: <span id="telTheta">0.0</span>°</div>
                <div>Vel. Angular: <span id="telOmega">0.0</span> rad/s</div>
                <div>Tiempo: <span id="telTime">0.00</span> s</div>
                <div>Gravedad: 9.81 $m/s^2$</div>
            </div>
        </div>
    </div>

    <script>
        // Configuración del Canvas
        const canvas = document.getElementById('robotCanvas');
        const ctx = canvas.getContext('2d');

        // Estado del sistema (Variables físicas y dinámicas)
        let sim = {
            // Parámetros
            m: 1.0,      // Masa
            l: 1.5,      // Longitud
            I: 0.5,      // Momento de inercia respecto al pivote
            g: 9.81,     // Gravedad
            b: 0.2,      // Coeficiente de fricción viscosa
            tau: 0.0,    // Torque externo

            // Variables de estado
            theta: 0.0,  // Ángulo en radianes
            omega: 0.0,  // Velocidad angular en rad/s
            time: 0.0,   // Tiempo transcurrido

            // Control de simulación
            running: false,
            lastFrameTime: null
        };

        // Captura de elementos DOM para telemetría
        const telTheta = document.getElementById('telTheta');
        const telOmega = document.getElementById('telOmega');
        const telTime = document.getElementById('telTime');

        // Inicializar o resetear variables con datos del usuario
        function initInputs() {
            sim.m = parseFloat(document.getElementById('mass').value);
            sim.l = parseFloat(document.getElementById('length').value);
            sim.I = parseFloat(document.getElementById('inertia').value);
            sim.theta = parseFloat(document.getElementById('theta').value) * Math.PI / 180; // Grados a Radianes
            sim.omega = parseFloat(document.getElementById('omega').value);
            sim.tau = parseFloat(document.getElementById('torque').value);
            sim.b = parseFloat(document.getElementById('damping').value);
            sim.time = 0.0;
        }

        // Modelo Físico: Calcula la aceleración angular (alpha)
        // Ecuación de movimiento: I * alpha = tau - m * g * (l/2) * sin(theta) - b * omega
        // (Asumiendo que la masa está distribuida o su centro de masa está a l/2)
        function computeAcceleration(theta, omega) {
            const torqueGravedad = -sim.m * sim.g * (sim.l / 2) * Math.sin(theta);
            const torqueFriccion = -sim.b * omega;
            const torqueTotal = sim.tau + torqueGravedad + torqueFriccion;
            return torqueTotal / sim.I;
        }

        // Actualización numérica usando el método de Euler-Cromer
        function updatePhysics(dt) {
            // Limitar dt para evitar saltos numéricos inestables si se congela la pestaña
            if (dt > 0.1) dt = 0.1; 

            const alpha = computeAcceleration(sim.theta, sim.omega);
            sim.omega += alpha * dt;
            sim.theta += sim.omega * dt;
            sim.time += dt;
        }

        // Renderizado del Canvas
        function drawRobot() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const originX = canvas.width / 2;
            const originY = canvas.height / 2;
            
            // Factor de escala: 1 metro equivale a 100 píxeles
            const scale = 100; 
            const endX = originX + sim.l * scale * Math.sin(sim.theta);
            const endY = originY + sim.l * scale * Math.cos(sim.theta); // El eje Y crece hacia abajo en Canvas

            // Dibujar cuadrícula de fondo referencial
            ctx.strokeStyle = '#2d2d5a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(originX, originY, sim.l * scale, 0, 2 * Math.PI);
            ctx.stroke();

            // Dibujar la línea del eslabón (Robot R)
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Dibujar la masa en el extremo (actúa como el actuador o extremo final)
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(endX, endY, 12 + (sim.m * 2), 0, 2 * Math.PI); // El tamaño varía levemente con la masa
            ctx.fill();

            // Dibujar la articulación / Base (Pivote)
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(originX, originY, 10, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Actualizar Telemetría en pantalla
            telTheta.innerText = (sim.theta * 180 / Math.PI).toFixed(1);
            telOmega.innerText = sim.omega.toFixed(2);
            telTime.innerText = sim.time.toFixed(2);
        }

        // Bucle principal de animación (Game Loop)
        function loop(timestamp) {
            if (!sim.running) return;

            if (!sim.lastFrameTime) sim.lastFrameTime = timestamp;
            const dt = (timestamp - sim.lastFrameTime) / 1000; // Convertir a segundos
            sim.lastFrameTime = timestamp;

            updatePhysics(dt);
            drawRobot();

            requestAnimationFrame(loop);
        }

        // Listeners de los botones de interacción
        document.getElementById('btnStart').addEventListener('click', () => {
            if (!sim.running) {
                // Si estaba pausado o se inicia por primera vez, lee los inputs actuales
                if (sim.time === 0) {
                    initInputs();
                } else {
                    // Si viene de una pausa, solo actualiza dinámicamente torque o fricción
                    sim.tau = parseFloat(document.getElementById('torque').value);
                    sim.b = parseFloat(document.getElementById('damping').value);
                }
                sim.running = true;
                sim.lastFrameTime = performance.now();
                requestAnimationFrame(loop);
            } else {
                sim.running = false;
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            sim.running = false;
            initInputs();
            drawRobot();
        });

        // Inicialización del render de partida
        initInputs();
        drawRobot();
    </script>
</body>
</html>
