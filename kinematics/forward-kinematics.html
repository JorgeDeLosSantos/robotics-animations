<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forward Kinematics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Three.js via import map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body);"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2 text-indigo-400">
            Forward Kinematics
        </h1>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left Control Panel -->
        <div class="w-full md:w-5/12 p-4 overflow-y-auto border-r border-slate-700 bg-slate-850 flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-200">DH Parameters</h2>
                <button id="add-row-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition-all flex items-center gap-1">
                    &#x2795; Add link
                </button>
            </div>

            <!-- DH Table: Type, a, alpha, d, theta -->
            <div class="overflow-x-auto rounded-lg border border-slate-700 bg-slate-900/50">
                <table class="w-full text-left border-collapse min-w-[450px]">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400 text-xs font-semibold border-b border-slate-700">
                            <th class="p-2.5 text-center w-10">#</th>
                            <th class="p-2.5 text-center w-10">Type</th>
                            <th class="p-2.5 text-center w-16">\(a\)</th>
                            <th class="p-2.5 text-center w-16">\(\alpha\) (deg)</th>
                            <th class="p-2.5 text-center w-16">\(d\)</th>
                            <th class="p-2.5 text-center w-16">\(\theta\) (deg)</th>
                            <th class="p-2.5 text-center w-8">.</th>
                        </tr>
                    </thead>
                    <tbody id="dh-table-body">
                        <!-- Dynamic rows are inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Homogeneous Transformation Matrix Display -->
            <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-3 flex flex-col gap-2">
                <h3 class="text-sm font-semibold text-indigo-400">Matrix \(T_n^0\)</h3>
                <div id="matrix-container" class="grid grid-cols-4 gap-1.5 font-mono text-[11px] bg-slate-950 p-2.5 rounded border border-slate-800 text-center text-emerald-400">
                </div>
            </div>
        </div>

        <!-- Right 3D Viewport (Orthographic Camera) -->
        <div class="w-full md:w-7/12 relative flex-1 min-h-[450px] md:min-h-0 bg-slate-950">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <!-- Camera Preset Controls -->
            <div class="absolute top-3 right-3 flex flex-wrap gap-1.5 bg-slate-900/80 backdrop-blur-sm border border-slate-700/60 p-1.5 rounded-lg shadow-lg z-10">
                <button id="btn-view-top" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Top (XY)
                </button>
                <button id="btn-view-front" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Front (XZ)
                </button>
                <button id="btn-view-side" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Side (YZ)
                </button>
                <button id="btn-view-iso" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Isometric
                </button>
            </div>
        </div>
    </main>

    <!-- Footer / Developer Credits -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="flex items-center gap-1.5 justify-center">
                Developed with &#x1F499; by 
                <a href="https://github.com/JorgeDeLosSantos" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="font-semibold text-indigo-400 hover:text-indigo-300 hover:underline transition-colors">
                    P.J. De Los Santos
                </a>
            </p>
        </div>
    </footer>

    <script type="module">
        import { RobotViewer } from './shared-robot-viewer.js';

        // Initial DH parameters for a 3-link manipulator (Revolute joints)
        const initialDHParams = [
            { type: 'R', theta: 0, d: 200, a: 0.0, alpha: 90 },
            { type: 'R', theta: 0, d: 0.0, a: 200, alpha: 0 },
            { type: 'R', theta: 0, d: 0.0, a: 200, alpha: 0 }
        ];

        // Create the robot viewer with shared components
        const viewer = new RobotViewer({
            canvasContainerId: 'canvas-container',
            tableBodyId: 'dh-table-body',
            addRowBtnId: 'add-row-btn',
            matrixContainerId: 'matrix-container',
            initialDHParams: initialDHParams,
            frustumSize: 1200,
            maxLinks: 6
        });

        // Forward kinematics uses the default updateRobotGeometry from the shared module.
        // The shared module already implements the FK-style rendering with:
        //   - Orthogonal link segments (d and a drawn separately)
        //   - Joint meshes (cylinder for R, box for P)
        //   - AxesHelpers at each frame
        // No override needed.

        window.onload = () => {
            viewer.init3D();
            viewer.renderTable();
            viewer.updateRobotGeometry();
        };
    </script>
</body>
</html>
