<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverse Kinematics (Position)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Three.js via import map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body);"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2 text-indigo-400">
            Inverse Kinematics (Position)
        </h1>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <div class="w-full md:w-5/12 p-4 overflow-y-auto border-r border-slate-700 bg-slate-850 flex flex-col gap-4">
            
            <div class="bg-slate-800/80 border border-indigo-500/40 rounded-lg p-4 flex flex-col gap-3 shadow-lg">
                <h3 class="text-sm font-bold text-indigo-300 flex items-center gap-2">IK Target</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[11px] text-slate-400 block mb-1">Target X</label>
                        <input type="number" id="ik-x" value="200" step="10" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-center font-mono text-amber-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-400 block mb-1">Target Y</label>
                        <input type="number" id="ik-y" value="0" step="10" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-center font-mono text-amber-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-400 block mb-1">Target Z</label>
                        <input type="number" id="ik-z" value="400" step="10" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-center font-mono text-amber-400 focus:outline-none">
                    </div>
                </div>
                <button id="solve-ik-btn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-2 rounded shadow transition-all">
                    Solve IK
                </button>
                <div id="ik-status" class="text-[11px] text-slate-400 italic text-center"></div>
            </div>

            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-200">DH Parameters</h2>
                <button id="add-row-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition-all flex items-center gap-1">
                    &#x2795; Add link
                </button>
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-700 bg-slate-900/50">
                <table class="w-full text-left border-collapse min-w-[400px]">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400 text-xs font-semibold border-b border-slate-700">
                            <th class="p-2.5 text-center w-10">#</th>
                            <th class="p-2.5 text-center w-10">Type</th>
                            <th class="p-2.5 text-center w-16">\(a\)</th>
                            <th class="p-2.5 text-center w-16">\(\alpha\) (deg)</th>
                            <th class="p-2.5 text-center w-16">\(d\)</th>
                            <th class="p-2.5 text-center w-16">\(\theta\) (deg)</th>
                            <th class="p-2.5 text-center w-8">.</th>
                        </tr>
                    </thead>
                    <tbody id="dh-table-body">
                    </tbody>
                </table>
            </div>

            <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-3 flex flex-col gap-2">
                <h3 class="text-sm font-semibold text-indigo-400">Matrix \(T_n^0\)</h3>
                <div id="matrix-container" class="grid grid-cols-4 gap-1.5 font-mono text-[11px] bg-slate-950 p-2.5 rounded border border-slate-800 text-center text-emerald-400">
                </div>
            </div>
        </div>

        <div class="w-full md:w-7/12 relative flex-1 min-h-[450px] md:min-h-0 bg-slate-950">
            <div id="canvas-container" class="w-full h-full"></div>
            <div class="absolute top-3 right-3 flex flex-wrap gap-1.5 bg-slate-900/80 backdrop-blur-sm border border-slate-700/60 p-1.5 rounded-lg shadow-lg z-10">
                <button id="btn-view-top" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Top (XY)
                </button>
                <button id="btn-view-front" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Front (XZ)
                </button>
                <button id="btn-view-side" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Side (YZ)
                </button>
                <button id="btn-view-iso" class="view-btn bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-1 px-2.5 rounded transition-all border border-slate-600/30">
                    Isometric
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { RobotViewer } from './shared-robot-viewer.js';
        import { solveIKPositionCCD } from './ik-solvers.js';

        // Initial DH parameters for a 3-link manipulator
        const initialDHParams = [
            { type: 'R', theta: 0, d: 200, a: 0.0, alpha: 90 },
            { type: 'R', theta: 0, d: 0.0, a: 200, alpha: 0 },
            { type: 'R', theta: 0, d: 0.0, a: 200, alpha: 0 }
        ];

        // Create the robot viewer with shared components
        const viewer = new RobotViewer({
            canvasContainerId: 'canvas-container',
            tableBodyId: 'dh-table-body',
            addRowBtnId: 'add-row-btn',
            matrixContainerId: 'matrix-container',
            initialDHParams: initialDHParams,
            frustumSize: 1200,
            maxLinks: 6
        });

        // Create target mesh for IK visualization
        const targetGeom = new THREE.SphereGeometry(10, 16, 16);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const targetMesh = new THREE.Mesh(targetGeom, targetMat);

        // Override init3D to add the target mesh
        const originalInit3D = viewer.init3D.bind(viewer);
        viewer.init3D = function() {
            originalInit3D();
            this.scene.add(targetMesh);
        };

        // Update target position from UI
        function updateTargetFromUI() {
            const x = parseFloat(document.getElementById('ik-x').value) || 0;
            const y = parseFloat(document.getElementById('ik-y').value) || 0;
            const z = parseFloat(document.getElementById('ik-z').value) || 0;
            targetMesh.position.set(x, y, z);
        }

        // Solve IK using CCD algorithm from ik-solvers module
        function solveIK() {
            const tx = parseFloat(document.getElementById('ik-x').value) || 0;
            const ty = parseFloat(document.getElementById('ik-y').value) || 0;
            const tz = parseFloat(document.getElementById('ik-z').value) || 0;
            const target = new THREE.Vector3(tx, ty, tz);

            const statusDiv = document.getElementById('ik-status');
            statusDiv.innerText = 'Computing...';

            const finalDist = solveIKPositionCCD(viewer, target);

            if (finalDist < 1.0) {
                statusDiv.className = 'text-[11px] text-emerald-400 font-bold text-center';
                statusDiv.innerText = `\u2714\uFE0F Success (Error: ${finalDist.toFixed(2)} units)`;
            } else {
                statusDiv.className = 'text-[11px] text-amber-400 font-bold text-center';
                statusDiv.innerText = `\u26A0\uFE0F Unreachable or Out of Range (Min Dist: ${finalDist.toFixed(2)} units)`;
            }

            viewer.renderTable();
            viewer.updateRobotGeometry();
        }

        // Attach event listeners
        document.getElementById('ik-x').addEventListener('input', updateTargetFromUI);
        document.getElementById('ik-y').addEventListener('input', updateTargetFromUI);
        document.getElementById('ik-z').addEventListener('input', updateTargetFromUI);
        document.getElementById('solve-ik-btn').addEventListener('click', solveIK);

        window.onload = () => {
            viewer.init3D();
            viewer.renderTable();
            viewer.updateRobotGeometry();
            updateTargetFromUI();
        };
    </script>
</body>
</html>
